# The Rust tools for Breath of Fire III: shared libraries and a thin command line.
#
#   crates/  shared libraries
#   cli/     command lines: argument parsing and printing only
#   gui/     the asset editor
#
# Every first-party crate is MIT (LICENSE). `cargo deny check` keeps dependencies permissive.
[workspace]
resolver = "3"
members = [
    "crates/rebof3-emi",
    "crates/rebof3-formats",
    "crates/rebof3-assets",
    "crates/rebof3-render",
    "cli/rebof3",
    "gui/rebof3-editor",
]

# gpui needs two patched crates. Their sources live once, in the bof3-player repository at the
# pinned tag; docs/adr/0001-one-workspace-and-gpui.md lists why and when each patch goes.
[patch.crates-io]
stacksafe-macro = { git = "https://github.com/raulcorreia7/bof3-player.git", tag = "v0.1.3" }
taffy = { git = "https://github.com/raulcorreia7/bof3-player.git", tag = "v0.1.3" }

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/raulcorreia7/bof3-tools"
homepage = "https://github.com/raulcorreia7/bof3-tools"
keywords = ["breath-of-fire", "playstation", "psx", "disc", "modding"]
categories = ["command-line-utilities", "game-development", "parser-implementations"]
publish = false

[workspace.dependencies]
rebof3-formats = { path = "crates/rebof3-formats", version = "0.2.0" }
rebof3-assets = { path = "crates/rebof3-assets", version = "0.2.0" }
rebof3-emi = { path = "crates/rebof3-emi", version = "0.2.0", default-features = false }
rebof3-render = { path = "crates/rebof3-render", version = "0.2.0", default-features = false }
emi = { git = "https://github.com/raulcorreia7/bof3-player.git", tag = "v0.1.3", version = "0.1.3", default-features = false }
bof3player = { git = "https://github.com/raulcorreia7/bof3-player.git", tag = "v0.1.3", version = "0.1.3", default-features = false }
psx-cd = { git = "https://github.com/raulcorreia7/bof3-player.git", tag = "v0.1.3", version = "0.1.3" }
psx-formats = { git = "https://github.com/raulcorreia7/bof3-player.git", tag = "v0.1.3", version = "0.1.3", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "error-context"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
gpui = "=0.2.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1

# The slow tests decode and hash the whole disc. Unoptimized code runs them about ten times
# slower, so dependencies and the library crates on the decode path build with optimizations
# (`"*"` covers only non-workspace crates, so the workspace crates are named). Debug assertions
# and overflow checks stay on, and the command lines keep fast debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.rebof3-assets]
opt-level = 2

[profile.dev.package.rebof3-formats]
opt-level = 2

[profile.dev.package.rebof3-emi]
opt-level = 2

[profile.dev.package.rebof3-render]
opt-level = 2

[profile.dev.package.bof3player]
opt-level = 2

[profile.dev.package.psx-audio]
opt-level = 2

[profile.dev.package.psx-cd]
opt-level = 2

[profile.dev.package.psx-formats]
opt-level = 2
