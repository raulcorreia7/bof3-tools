[package]
name = "rebof3"
description = "The Breath of Fire III toolchain: disc, EMI and assets commands"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish.workspace = true

[[bin]]
name = "bof3"
path = "src/main.rs"

[features]
default = ["assets"]
assets = ["dep:rebof3-assets", "dep:bof3player", "dep:sha2"]

[dependencies]
rebof3-assets = { workspace = true, optional = true }
bof3player = { workspace = true, features = ["std", "ogg", "bundled-names"], optional = true }
rebof3-emi = { workspace = true, features = ["std"] }
psx-cd.workspace = true
psx-formats = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }

[dev-dependencies]
rebof3-emi = { workspace = true, features = ["std", "fixtures"] }
psx-formats = { workspace = true, features = ["std", "fixtures"] }

[lints]
workspace = true
