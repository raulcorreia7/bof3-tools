# cargo-deny policy: permissive licenses only. Check with `cargo deny check`.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "ISC",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

allow-git = ["https://github.com/raulcorreia7/bof3-player.git?tag=v0.1.3"]

[advisories]
# The editor's screen-reader support (egui's AccessKit on Linux) reaches D-Bus through zbus, whose
# `zbus_names`, `zvariant` and `zvariant_derive` crates are flagged unmaintained, not vulnerable. Drop these entries when
# AccessKit moves off them.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via AccessKit's D-Bus link; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via AccessKit's D-Bus link; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via AccessKit's D-Bus link; unmaintained, no vulnerability" },
]
