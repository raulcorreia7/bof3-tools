# cargo-deny policy: permissive licenses only. Check with `cargo deny check`.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "ISC",
    # gpui's font, shader and image crates; the same list as bof3-player.
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

allow-git = ["https://github.com/raulcorreia7/bof3-player.git?tag=v0.1.3"]

[advisories]
# Crates that gpui (the editor's toolkit) pulls in and that are flagged unmaintained, not vulnerable.
# Remove an entry when gpui drops the crate; docs/adr/0001-one-workspace-and-gpui.md has the list.
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std, via gpui; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2024-0384", reason = "instant, via gpui; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, via gpui; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2024-0436", reason = "paste, via gpui; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, via gpui; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via gpui; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via gpui; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via gpui's D-Bus link; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via gpui's D-Bus link; unmaintained, no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via gpui's D-Bus link; unmaintained, no vulnerability" },
]
