[package]
name = "rebof3-editor"
description = "Asset editor for the EMI archives of Breath of Fire III: browse, view and edit every entry without touching the disc files."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bof3-edit"
path = "src/main.rs"

[dependencies]
rebof3-emi = { workspace = true, features = ["std"] }
rebof3-formats.workspace = true
rebof3-assets.workspace = true
rebof3-observe.workspace = true
bof3player = { workspace = true, features = ["std"] }
psx-formats = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
cpal = "0.18.2"
# The output resampler for a device that does not run at the library's 44.1 kHz. Pinned: its
# majors come quickly and change the API.
rubato = "=5.0.1"

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
