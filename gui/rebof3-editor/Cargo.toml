[package]
name = "rebof3-editor"
description = "Asset editor for the EMI archives of Breath of Fire III: browse, view and edit every entry without touching the disc files."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bof3-edit"
path = "src/main.rs"

[dependencies]
rebof3-catalog.workspace = true
rebof3-emi = { workspace = true, features = ["std"] }
rebof3-formats.workspace = true
rebof3-assets.workspace = true
rebof3-observe.workspace = true
bof3player = { workspace = true, features = ["std"] }
psx-formats = { workspace = true, features = ["std"] }
serde_json.workspace = true
gpui.workspace = true
psx-render.workspace = true
# The frame type gpui paints a rendered image from.
image.workspace = true
cpal.workspace = true
rubato.workspace = true

[features]
default = ["gles"]
# Draws the area view through offscreen OpenGL ES when a context opens; the software path always builds.
gles = ["psx-render/gles"]

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
